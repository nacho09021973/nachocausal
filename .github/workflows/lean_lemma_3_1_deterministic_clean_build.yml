name: Lean deterministic Lemma 3.1 clean build

on:
  push:
    branches:
      - ci/nc2fb-lemma-3-1-clean-build

permissions:
  contents: read

jobs:
  lake-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout the exact certified commit
        uses: actions/checkout@v4
        with:
          ref: 9cd99f776bbdeb88082420c088c4a035a2a82ba7
          fetch-depth: 1

      - name: Guard the exact source commit and clean Lake state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "9cd99f776bbdeb88082420c088c4a035a2a82ba7"
          test ! -e formal/HorizonFormal/.lake

      - name: Install the Lean toolchain manager
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build from the fresh checkout
        working-directory: formal/HorizonFormal
        shell: bash
        run: |
          set -euo pipefail
          lake build
